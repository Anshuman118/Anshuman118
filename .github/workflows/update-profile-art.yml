name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install heatmap dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4

      - name: Fetch public contribution calendar
        env:
          GITHUB_USERNAME: Anshuman118
        run: python scripts/fetch_contributions.py --username "$GITHUB_USERNAME"

      - name: Render contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit changed generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
